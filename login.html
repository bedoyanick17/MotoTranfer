<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoTransfer | Iniciar Sesión</title>
    <link rel="shortcut icon" href="ICONs/Moto48x48.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">MotoTransfer</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto align-items-center">
                    <a class="nav-link nav-return-btn" href="index.html">
                      <span class="arrow">←</span> Volver al Inicio
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="form-background">
            <div class="logo-container">
                <img src="ICONs/MotoTransfer.png" alt="MotoTransfer Logo" class="login-logo">
            </div>
            
            <h1>Iniciar sesión</h1>
            
            <form>
                <div class="input-group-custom">
                    <input type="email" name="email" placeholder="Correo electrónico" required>
                </div>
                <div class="input-group-custom">
                    <input type="password" name="password" placeholder="Contraseña" required>
                </div>
                <input type="submit" value="Ingresar" class="btn-submit">
            </form>

            <div class="login-footer">
                <p>¿Necesitas una cuenta? <a href="register.html">Regístrate aquí</a></p>
            </div>
        </div>
    </div>

    <script src="JS/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
